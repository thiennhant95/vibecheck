[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vibecheck"
version = "0.4.0"
description = "Audit AI-generated code before it ships — security & AI-slop scanner with AST + regex hybrid engine"
readme = "README.en.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["security", "linter", "ai-code", "vibe-coding", "sast", "code-audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

[project.scripts]
vibecheck = "vibecheck:main"

[tool.setuptools]
py-modules = ["vibecheck"]
